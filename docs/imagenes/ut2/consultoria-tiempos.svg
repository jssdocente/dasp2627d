<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="t d" font-family="Roboto, Arial, sans-serif">
  <title id="t">Tiempos de la Consultoría exprés</title>
  <desc id="d">Veinticinco minutos en total: leer el encargo, 3 minutos; rellenar la ficha, 12; auditoría cruzada, 5; y puesta en común, 5.</desc>
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #263238; text-anchor: middle; }
    .s { font-size: 12.5px; fill: #37474f; text-anchor: middle; }
    .e { font-size: 13px; font-style: italic; fill: #546e7a; }
    .z { font-size: 14px; font-weight: 700; fill: #546e7a; }
    .h { font-size: 17px; font-weight: 700; fill: #263238; }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker>
    <marker id="fi" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#546e7a"/></marker>
  </defs>
  <rect width="900" height="210" rx="12" fill="#ffffff"/>
  
  <text x="450.0" y="36.0" class="h" text-anchor="middle">25 minutos en total</text>
  <rect x="40.0" y="60" width="98.4" height="80" fill="#bbdefb" stroke="#ffffff" stroke-width="3"/>
  <text x="89.2" y="104.0" class="s" text-anchor="middle">3 min</text>
  <text x="89.2" y="52.0" class="e" text-anchor="middle">Leer el encargo</text>
  <rect x="138.4" y="60" width="393.6" height="80" fill="#ffe0b2" stroke="#ffffff" stroke-width="3"/>
  <text x="335.2" y="96.0" class="t" text-anchor="middle">Rellenar la ficha</text>
  <text x="335.2" y="118.0" class="s" text-anchor="middle">12 min</text>
  <rect x="532.0" y="60" width="164.0" height="80" fill="#e1bee7" stroke="#ffffff" stroke-width="3"/>
  <text x="614.0" y="96.0" class="t" text-anchor="middle">Auditoría cruzada</text>
  <text x="614.0" y="118.0" class="s" text-anchor="middle">5 min</text>
  <rect x="696.0" y="60" width="164.0" height="80" fill="#c8e6c9" stroke="#ffffff" stroke-width="3"/>
  <text x="778.0" y="96.0" class="t" text-anchor="middle">Puesta en común</text>
  <text x="778.0" y="118.0" class="s" text-anchor="middle">5 min</text>
  <line x1="40.0" y1="145" x2="40.0" y2="155" stroke="#546e7a" stroke-width="2"/>
  <text x="40.0" y="175.0" class="e" text-anchor="middle">0′</text>
  <line x1="138.4" y1="145" x2="138.4" y2="155" stroke="#546e7a" stroke-width="2"/>
  <text x="138.4" y="175.0" class="e" text-anchor="middle">3′</text>
  <line x1="532.0" y1="145" x2="532.0" y2="155" stroke="#546e7a" stroke-width="2"/>
  <text x="532.0" y="175.0" class="e" text-anchor="middle">15′</text>
  <line x1="696.0" y1="145" x2="696.0" y2="155" stroke="#546e7a" stroke-width="2"/>
  <text x="696.0" y="175.0" class="e" text-anchor="middle">20′</text>
  <line x1="860.0" y1="145" x2="860.0" y2="155" stroke="#546e7a" stroke-width="2"/>
  <text x="860.0" y="175.0" class="e" text-anchor="middle">25′</text>
</svg>
