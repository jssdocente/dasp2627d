<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="Roboto, Arial, sans-serif">
  <title id="t">Mantenimiento predictivo al conectar IT y OT</title>
  <desc id="d">En la planta (OT), un sensor detecta una vibración anómala en una máquina. Por una conexión segura llega a gestión (IT): el análisis predice una avería, el ERP pide el repuesto y la planificación programa la parada, que vuelve a la máquina en el mejor momento.</desc>
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #263238; text-anchor: middle; }
    .s { font-size: 12.5px; fill: #37474f; text-anchor: middle; }
    .e { font-size: 13px; font-style: italic; fill: #546e7a; }
    .z { font-size: 14px; font-weight: 700; fill: #546e7a; }
    .h { font-size: 17px; font-weight: 700; fill: #263238; }
    @keyframes viaje { 0.00% { transform: translate(0.0px, 0.0px); opacity: 0; } 1.87% { transform: translate(0.0px, 0.0px); opacity: 1; } 15.09% { transform: translate(282.0px, 0.0px); opacity: 1; } 16.96% { transform: translate(282.0px, 0.0px); opacity: 1; } 25.40% { transform: translate(462.0px, 0.0px); opacity: 1; } 27.27% { transform: translate(462.0px, 0.0px); opacity: 1; } 35.71% { transform: translate(642.0px, 0.0px); opacity: 1; } 37.58% { transform: translate(642.0px, 0.0px); opacity: 1; } 43.44% { transform: translate(642.0px, 125.0px); opacity: 1; } 45.31% { transform: translate(642.0px, 125.0px); opacity: 1; } 75.39% { transform: translate(0.0px, 125.0px); opacity: 1; } 77.27% { transform: translate(0.0px, 125.0px); opacity: 1; } 83.13% { transform: translate(0.0px, 0.0px); opacity: 1; } 85.00% { transform: translate(0.0px, 0.0px); opacity: 1; } 88.00% { transform: translate(0.0px, 0.0px); opacity: 0; } 100% { transform: translate(0.0px, 0.0px); opacity: 0; } }
    .punto { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) { .punto { animation: viaje 10s linear infinite; } }
    @keyframes r0 { 0%, 0.00% { stroke: #546e7a; stroke-width: 1.5; } 0.00%, 5.87% { stroke: #e65100; stroke-width: 4; } 8.87%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-m { animation: r0 10s linear infinite; } }
    @keyframes r1 { 0%, 14.58% { stroke: #546e7a; stroke-width: 1.5; } 15.09%, 20.96% { stroke: #e65100; stroke-width: 4; } 23.96%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-an { animation: r1 10s linear infinite; } }
    @keyframes r2 { 0%, 24.89% { stroke: #546e7a; stroke-width: 1.5; } 25.40%, 31.27% { stroke: #e65100; stroke-width: 4; } 34.27%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-erp { animation: r2 10s linear infinite; } }
    @keyframes r3 { 0%, 35.20% { stroke: #546e7a; stroke-width: 1.5; } 35.71%, 41.58% { stroke: #e65100; stroke-width: 4; } 44.58%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-pl { animation: r3 10s linear infinite; } }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker>
    <marker id="fi" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#546e7a"/></marker>
  </defs>
  <rect width="900" height="320" rx="12" fill="#ffffff"/>
  <rect x="20" y="40" width="255" height="200" rx="12" fill="#fff8e1" stroke="#b0bec5" stroke-dasharray="4 4"/>
  <text x="34" y="64" class="z">OT: planta</text>
  <rect x="305" y="40" width="575" height="200" rx="12" fill="#e3f2fd" stroke="#b0bec5" stroke-dasharray="4 4"/>
  <text x="319" y="64" class="z">IT: gestión</text>
  <circle class="punto" cx="148" cy="150" r="9" fill="#e65100"/>
  <rect id="n-m" class="nodo" x="48.0" y="117.0" width="200" height="66" rx="10" fill="#ffe0b2" stroke="#546e7a" stroke-width="1.5"/>
    <text x="148.0" y="146.5" class="t">Sensor en una máquina</text>
    <text x="148.0" y="164.5" class="s">vibración anómala</text>
  <rect id="n-an" class="nodo" x="355.0" y="117.0" width="150" height="66" rx="10" fill="#bbdefb" stroke="#546e7a" stroke-width="1.5"/>
    <text x="430.0" y="146.5" class="t">Análisis</text>
    <text x="430.0" y="164.5" class="s">predice una avería</text>
  <rect id="n-erp" class="nodo" x="535.0" y="117.0" width="150" height="66" rx="10" fill="#bbdefb" stroke="#546e7a" stroke-width="1.5"/>
    <text x="610.0" y="146.5" class="t">ERP</text>
    <text x="610.0" y="164.5" class="s">pide el repuesto</text>
  <rect id="n-pl" class="nodo" x="715.0" y="117.0" width="150" height="66" rx="10" fill="#bbdefb" stroke="#546e7a" stroke-width="1.5"/>
    <text x="790.0" y="146.5" class="t">Planificación</text>
    <text x="790.0" y="164.5" class="s">programa la parada</text>
  <path d="M248.0,150.0 L351.0,150.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <text x="299.5" y="136.0" class="e" text-anchor="middle">Conexión segura</text>
  <path d="M505.0,150.0 L531.0,150.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M685.0,150.0 L711.0,150.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M790.0,183.0 L790.0,275.0 L148.0,275.0 L148.0,187.0" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f)"/>
  <text x="470.0" y="300.0" class="e" text-anchor="middle">Parada en el mejor momento</text>
</svg>
