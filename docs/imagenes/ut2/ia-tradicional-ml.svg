  <rect id="n-p1" class="nodo" x="465.0" y="59.0" width="150" height="62" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
    <text x="540.0" y="94.5" class="t">Programa</text>
