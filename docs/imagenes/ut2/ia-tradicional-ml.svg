    <marker id="fi" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#546e7a"/></marker>
  </defs>
  <rect width="900" height="290" rx="12" fill="#ffffff"/>
  
  <text x="20.0" y="35.0" class="z" text-anchor="start">Programación tradicional</text>
  <text x="20.0" y="165.0" class="z" text-anchor="start">Machine learning</text>
