<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d" font-family="Roboto, Arial, sans-serif">
  <title id="t">Programación tradicional frente a machine learning</title>
  <desc id="d">En la programación tradicional, la persona escribe las reglas, el programa las aplica a los datos y da un resultado. En machine learning se dan datos con sus resultados conocidos, y el entrenamiento produce un modelo con reglas aprendidas: las reglas pasan de ser la entrada a ser la salida.</desc>
