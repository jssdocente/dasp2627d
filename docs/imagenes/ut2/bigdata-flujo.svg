<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d" font-family="Roboto, Arial, sans-serif">
  <title id="t">Del dato a la decisión</title>
  <desc id="d">Los datos de las fuentes (ventas, sensores, web) pasan por limpieza, análisis y un indicador clave antes de llegar a una decisión. Después se vuelve al indicador para comprobar si la decisión ha funcionado. Un punto gris que se vuelve azul al limpiarse recorre el proceso.</desc>
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #263238; text-anchor: middle; }
    .s { font-size: 12.5px; fill: #37474f; text-anchor: middle; }
    .e { font-size: 13px; font-style: italic; fill: #546e7a; }
    .z { font-size: 14px; font-weight: 700; fill: #546e7a; }
    .h { font-size: 17px; font-weight: 700; fill: #263238; }
    @keyframes viaje { 0.00% { transform: translate(0.0px, 0.0px); fill: #90a4ae; opacity: 0; } 3.70% { transform: translate(0.0px, 0.0px); fill: #90a4ae; opacity: 1; } 20.33% { transform: translate(180.0px, 0.0px); fill: #90a4ae; opacity: 1; } 24.02% { transform: translate(180.0px, 0.0px); fill: #90a4ae; opacity: 1; } 40.65% { transform: translate(360.0px, 0.0px); fill: #1565c0; opacity: 1; } 44.35% { transform: translate(360.0px, 0.0px); fill: #1565c0; opacity: 1; } 60.98% { transform: translate(540.0px, 0.0px); fill: #1565c0; opacity: 1; } 64.67% { transform: translate(540.0px, 0.0px); fill: #1565c0; opacity: 1; } 81.30% { transform: translate(720.0px, 0.0px); fill: #2e7d32; opacity: 1; } 85.00% { transform: translate(720.0px, 0.0px); fill: #2e7d32; opacity: 1; } 88.00% { transform: translate(720.0px, 0.0px); opacity: 0; } 100% { transform: translate(720.0px, 0.0px); opacity: 0; } }
    .punto { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) { .punto { animation: viaje 8s linear infinite; } }
    @keyframes r0 { 0%, 0.00% { stroke: #546e7a; stroke-width: 1.5; } 0.00%, 7.70% { stroke: #e65100; stroke-width: 4; } 10.70%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-f { animation: r0 8s linear infinite; } }
    @keyframes r1 { 0%, 19.82% { stroke: #546e7a; stroke-width: 1.5; } 20.33%, 28.02% { stroke: #e65100; stroke-width: 4; } 31.02%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-l { animation: r1 8s linear infinite; } }
    @keyframes r2 { 0%, 40.14% { stroke: #546e7a; stroke-width: 1.5; } 40.65%, 48.35% { stroke: #e65100; stroke-width: 4; } 51.35%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-a { animation: r2 8s linear infinite; } }
    @keyframes r3 { 0%, 60.47% { stroke: #546e7a; stroke-width: 1.5; } 60.98%, 68.67% { stroke: #e65100; stroke-width: 4; } 71.67%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-k { animation: r3 8s linear infinite; } }
    @keyframes r4 { 0%, 80.79% { stroke: #546e7a; stroke-width: 1.5; } 81.30%, 89.00% { stroke: #e65100; stroke-width: 4; } 92.00%, 100% { stroke: #546e7a; stroke-width: 1.5; } }
    @media (prefers-reduced-motion: no-preference) { #n-d { animation: r4 8s linear infinite; } }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker>
    <marker id="fi" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#546e7a"/></marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#ffffff"/>
  <circle class="punto" cx="90.0" cy="100" r="9" fill="#1565c0"/>
  <rect id="n-f" class="nodo" x="17.5" y="61.0" width="145" height="78" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
    <text x="90.0" y="88.5" class="t">Fuentes</text>
    <text x="90.0" y="106.5" class="s">ventas, sensores,</text>
    <text x="90.0" y="122.5" class="s">web</text>
  <rect id="n-l" class="nodo" x="197.5" y="61.0" width="145" height="78" rx="10" fill="#fff9c4" stroke="#546e7a" stroke-width="1.5"/>
    <text x="270.0" y="88.5" class="t">Limpieza</text>
    <text x="270.0" y="106.5" class="s">errores,</text>
    <text x="270.0" y="122.5" class="s">duplicados</text>
  <rect id="n-a" class="nodo" x="377.5" y="61.0" width="145" height="78" rx="10" fill="#bbdefb" stroke="#546e7a" stroke-width="1.5"/>
    <text x="450.0" y="88.5" class="t">Análisis</text>
    <text x="450.0" y="106.5" class="s">totales, grupos,</text>
    <text x="450.0" y="122.5" class="s">tendencias</text>
  <rect id="n-k" class="nodo" x="557.5" y="61.0" width="145" height="78" rx="10" fill="#e1bee7" stroke="#546e7a" stroke-width="1.5"/>
    <text x="630.0" y="96.5" class="t">KPI</text>
    <text x="630.0" y="114.5" class="s">indicador clave</text>
  <rect id="n-d" class="nodo" x="737.5" y="61.0" width="145" height="78" rx="10" fill="#c8e6c9" stroke="#546e7a" stroke-width="1.5"/>
    <text x="810.0" y="104.5" class="t">Decisión</text>
  <path d="M162.5,100.0 L193.5,100.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M342.5,100.0 L373.5,100.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M522.5,100.0 L553.5,100.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M702.5,100.0 L733.5,100.0" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#f)"/>
  <path d="M810.0,139.0 L810.0,200.0 L630.0,200.0 L630.0,143.0" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f)"/>
  <text x="720.0" y="225.0" class="e" text-anchor="middle">¿Ha funcionado?</text>
</svg>
