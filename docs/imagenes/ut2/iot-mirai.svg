  <title id="t">Cómo unas cámaras inseguras dejaron sin servicio a medio Internet</title>
  <desc id="d">Fase 1: el malware Mirai entra en cámaras y grabadores que conservan la contraseña de fábrica. Fase 2: los dispositivos infectados envían a la vez una avalancha de peticiones a Dyn, un proveedor de DNS. Fase 3: Dyn se satura y quienes intentan entrar en webs como Twitter, GitHub o Netflix no obtienen respuesta, aunque esas webs seguían funcionando.</desc>
